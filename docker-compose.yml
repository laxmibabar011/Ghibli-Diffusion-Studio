services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://ghibli:ghibli_password@db:5432/ghibli_db
      - SECRET_KEY=your_secret_key_here
    volumes:
      - ./backend:/app/backend
      - ./backend/outputs:/app/outputs
    depends_on:
      - db
    # Enable NVIDIA GPU support if available
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [ gpu ]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=ghibli
      - POSTGRES_PASSWORD=ghibli_password
      - POSTGRES_DB=ghibli_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
